name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist to S3 (public-read)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ir-central1
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          # Newer AWS CLI checksums aren't supported by most non-AWS S3 providers
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "S3_ACCESS_KEY and S3_SECRET_KEY are empty."
            exit 1
          fi
          case "$S3_ENDPOINT" in
            http://*|https://*) endpoint="$S3_ENDPOINT" ;;
            *) endpoint="https://$S3_ENDPOINT" ;;
          esac
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --endpoint-url "$endpoint" \
            --acl public-read \
            --delete
